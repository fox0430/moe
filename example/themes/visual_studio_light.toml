# Theme color configuration
# Converted from VS Code's "Light (Visual Studio)" theme (light_vs.json).
# Colors that light_vs.json does not define were taken from VS Code's built-in
# light-theme defaults. Semi-transparent VS Code colors (#RRGGBBAA) were
# pre-blended against the white background, since moe only takes #RRGGBB.
#
# Color format: "#RRGGBB" (hex) or "termDefault" (terminal default color)

[Colors]

foreground = "#000000"
background = "#ffffff"

lineNum = { fg = "#237893", bg = "#ffffff" }

currentLineNum = { fg = "#0b216f", bg = "#ffffff" }

