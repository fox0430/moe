# Language server configurations
# You can add any language by creating a section [Lsp.<language>]
# with extensions, command, and trace settings

[Lsp.nim]

extensions = ["nim"]                   # File extensions for this language

command = "nimlangserver"              # LSP server command

trace = "verbose"                      # Trace level: "off", "messages", "verbose"

[Lsp.rust]

extensions = ["rs"]                    # File extensions for this language

command = "rust-analyzer"              # LSP server command

trace = "verbose"                      # Trace level

rustAnalyzerRunSingle = true           # rust-analyzer specific: run single

rustAnalyzerDebugSingle = true         # rust-analyzer specific: debug single

# [CommandAliases]
# Define custom command aliases for built-in editor commands.
# Each key is the alias name, value is a table with "command" and optional "description".
# Usage: :x => quit, :ww => saveall
# Built-in aliases (from loadDefaultConfig) can be overridden.
#
# x = { command = "quit" }
# ww = { command = "saveall", description = "Save all buffers" }
# fmt = { command = "lspformat", description = "Format code with LSP" }

# [DisabledCommandAliases]
# Disable built-in command aliases.
# Each entry must name a built-in default alias (q, w, wq, ...).
# A user alias defined in [CommandAliases] may reuse a disabled default's name.
#
# aliases = ["q", "w"]

# [ShellCommands]
# Define shell commands that can be invoked from command mode.
# Each key is the command name, value is a table with "command" and optional "description".
# Usage: :nimbuild => runs "nimble build"
# Arguments are appended: :nimbuild --release => runs "nimble build --release"
# Built-in commands and aliases always take priority over shell commands.
#
# nimbuild = { command = "nimble build", description = "Build project" }
# nimtest = { command = "nimble test" }
# gitlog = { command = "git log --oneline -20", description = "Recent commits" }
