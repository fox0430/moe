merge = false                          # ✅ Merge status lines (IMPLEMENTED) - single bottom status line in multi-window mode

mode = true                            # ✅ Show mode in status line (IMPLEMENTED)

filename = true                        # ✅ Show filename in status line (IMPLEMENTED)

chanedMark = true                      # ✅ Show changed mark [+] (IMPLEMENTED)

