[Standard]

number = true                          # Line numbers

relativeNumber = false                 # Relative line numbers

statusLine = true                      # Show status line

syntax = true                          # Syntax highlighting

indentationLines = true                # Indentation guides

tabStop = 2                            # Tab width

shiftWidth = 0                         # Indent width  (0 = use tabStop)

softTabStop = 0                        # Tab/Backspace width in insert mode (0 = use tabStop)

expandTab = false                      # Insert spaces instead of tab

sidebar =  false                       # Show sidebar

scrollbar = true                       # Show scrollbar

scrollbarWidth = 1                     # Scrollbar width (0 = hidden)

bookmarkMarker = "♥ "                  # Bookmark indicator in sidebar

showModifiedLines = true               # Highlight modified line numbers

autoCloseParen = true                  # Auto-close parentheses

autoIndent = true                      # Auto-indent

smartIndent = false                    # Language-aware extra indent on Enter (Nim only currently)

ignorecase = true                      # Search case insensitive

smartcase = true                       # Smart case search

disableChangeCursor = false            # Disable cursor shape changes

defaultCursor = "terminalDefault"      # Default cursor style - restored on exit

normalModeCursor = "blinkBlock"        # Normal mode cursor

insertModeCursor = "blinkIbeam"        # Insert mode cursor

liveReloadOfConf = false               # Live config reload - Set to true to auto-reload config on file change

incrementalSearch = true               # Incremental search

autoDeleteParen = true                 # Auto-delete matching parens - Set to false to disable

bracketSplit = "disable"               # Enter behavior between () [] {} pairs: "disable", "noIndent", "indent"

liveReloadOfFile = true                # Auto-reload when file changed externally

colorMode = "256"                      # Color mode: "8", "16", "256", "24bit", "none"

mouse = false                           # Enable mouse support

lineWrap = true                        # Wrap long lines

timeoutlen = 1000                      # Key mapping timeout in ms (0 = no timeout)

[BufferBackend]

kind = "auto"                          # Buffer data structure: "auto", "gapBuffer", "sqrtDecomp", "rope", "pieceTable"

[Clipboard]

enable = true                          # Clipboard integration

tool = "xsel"                          # Tool: xsel, xclip, wl-clipboard, etc.

[BuildOnSave]

enable = false                         # Build on save feature

# workspaceRoot = "/path/to/project"   # Working directory for build

command = "nimble build"               # Custom build command

# A hung build is killed once this elapses (0 = wait forever)
timeout = 300                          # Timeout in seconds

[TabLine]

enable = true                          # Enable tab line

[StatusLine]

multipleStatusLine = true              # Show status line per window

merge = false                          # Merge status lines - single bottom status line in multi-window mode

mode = true                            # Show mode in status line

filename = true                        # Show filename in status line

changedMark = true                     # Show changed mark [+]

directory = true                       # Show full directory path - false shows just filename

gitChangedLines = true                 # Show git changed lines count +N ~N -N

gitBranchName = true                   # Show git branch name

showGitInactive = false                # Show git info in inactive windows

showModeInactive = false               # Show mode in inactive windows

# Custom status line format
# Supported placeholders:
#   {lineNumber}    - Current line number
#   {totalLines}    - Total lines in buffer
#   {columnNumber}  - Current column number
#   {totalColumns}  - Total columns in current line
#   {encoding}      - File encoding (e.g., "UTF-8")
#   {fileType}      - File type/language (e.g., "Nim", "Toml")
#   {percentage}    - Line percentage (e.g., "50%")
#   {mode}          - Current editor mode
#   {filename}      - Filename only
#   {directory}     - Directory path
#   {filePath}      - Full file path
#   {gitBranch}     - Git branch name
#   {lineEnding}    - Line ending (LF, CRLF, CR)
#   {gitBranch}     - Git branch name
#   {gitChanges}    - Git changes (+N ~N -N)
setupText = "{lineNumber}/{totalLines} {columnNumber}/{totalColumns} {encoding} {lineEnding} {fileType}"

[Highlight]

currentLine = true                     # Highlight current line

currentColumn = false                  # Highlight current column

reservedWord = ["TODO", "WIP", "NOTE"] # Highlight reserved words

replaceText = true                     # Live substitute preview - shows :s/foo/bar/ changes in real-time

pairOfParen = true                     # Highlight matching parens - highlights matching bracket when cursor is on one

fullWidthSpace = true                  # Highlight full-width spaces

trailingSpaces = true                  # Highlight trailing spaces

currentWord = true                     # Highlight current word - highlights all occurrences of word under cursor

findCharHighlight = true               # Highlight f/F/t/T matches

colorCodeHighlight = true               # Highlight inline color codes (#RRGGBB, #RGB) with their actual color

gitConflict = true                     # Highlight git merge conflict blocks (<<<<<<< / ======= / >>>>>>>)

gitConflictTwoColor = true             # Use two-color scheme (ours / theirs distinct); false for single red background

maxHighlightLineLength = 3000          # Stop syntax highlighting a line past this many characters (0 = unlimited); bounds frame time on very long lines such as minified code

[AutoBackup]

enable = false                         # Auto-backup feature

# backupDir = "/home/user/.cache/moe/backups"  # Backup directory

# 10 second idle time before backup
idleTime = 10                          # Idle time in seconds

# 5 minute interval between backups
interval = 5                           # Interval in minutes

dirToExclude = ["/etc"]                # Directories to exclude

[QuickRun]

saveBufferWhenQuickRun = true          # Save buffer before running

# command = "nimble build"             # Custom command override

# A program still running after this is killed (0 = wait forever)
timeout = 30                           # Timeout in seconds

# nimAdvancedCommand = "js"            # Nim advanced command e.g., "js" for JavaScript

# ClangOptions = "-Wall"               # C compiler options

# CppOptions = "-Wall"                 # C++ compiler options

# NimOptions = "--debugger:native"     # Nim compiler options

# shOptions = "-c"                     # sh shell options

# bashOptions = "-c"                   # bash shell options

[Notification]

popupNotifications = false             # Show notifications as floating popups

popupPosition = "bottomRight"          # Popup position: topRight, bottomRight, topLeft, bottomLeft

popupTimeoutMs = 3000                  # Auto-dismiss timeout in milliseconds

popupMaxVisible = 3                    # Maximum simultaneous popup notifications

popupMaxWidth = 60                     # Maximum popup width in characters

popupBorder = false                    # Show border around popup notifications

screenNotifications = true             # Global screen notifications

logNotifications = true                # Global log notifications

autoBackupScreenNotify = true          # Auto-backup screen notifications

autoBackupLogNotify = true             # Auto-backup log notifications

autoSaveScreenNotify = true            # Auto-save screen notifications

autoSaveLogNotify = true               # Auto-save log notifications

yankScreenNotify = true                # Yank screen notifications

yankLogNotify = true                   # Yank log notifications

deleteScreenNotify = true              # Delete screen notifications

deleteLogNotify = true                 # Delete log notifications

saveScreenNotify = true                # Save screen notifications

saveLogNotify = true                   # Save log notifications

quickRunScreenNotify = true            # QuickRun screen notifications

quickRunLogNotify = true               # QuickRun log notifications

buildOnSaveScreenNotify = true         # Build-on-save screen notifications

buildOnSaveLogNotify = true            # Build-on-save log notifications

filerScreenNotify = true               # Filer screen notifications

filerLogNotify = true                  # Filer log notifications

restoreScreenNotify = true             # Restore screen notifications

restoreLogNotify = true                # Restore log notifications

lspScreenNotify = true                 # LSP screen notifications

lspLogNotify = true                    # LSP log notifications

lspForcePopup = true                   # Force all LSP messages to popup notifications

[Filer]

showIcons = true                       # File browser icons - emoji icons for file types

[Autocomplete]

enable = true                          # Autocomplete enable/disable

windowBorder = true                    # Autocomplete window border

[AutoSave]

enable = true                          # Auto-save feature

interval = 5                           # Auto-save interval in minutes

[Persist]

commandHistory = true                  # Persist Command mode command history

commandHistoryLimit = 1000             # History limit

search = true                          # Persist search history

searchHistoryLimit = 1000              # Search history limit

cursorPosition = true                  # Persist cursor position per file

bookmarks = true                       # Persist bookmarks

[Git]

showChangedLine = true                 # Show git diff indicators in sidebar

updateInterval = 1000                  # Git diff update interval in milliseconds

[SyntaxChecker]

enable = false                         # Enable syntax checker in sidebar

# A hung check is killed once this elapses (0 = wait forever)
timeout = 60                           # Timeout in seconds

[SmoothScroll]

enable = true                          # Smooth scrolling

friction = 80.0                        # Friction coefficient (velocity decay rate)

airDrag = 2.0                          # Air drag coefficient (velocity resistance)

[FileTree]
width = 30                             # Width of the fileTree sidebar

[StartUp.FileOpen]
autoSplit = true                       # Auto-split on startup when opening multiple files
splitType = "vertical"                 # Split type: "vertical" or "horizontal"

[StartUp.FileTree]
enable = false                         # Open fileTree sidebar on startup

# Key mapping settings - persistent key remappings per mode
# Same key notation as :nmap/:imap commands
# Values can be command names (e.g., "save") or key sequences (e.g., "Escape")
#
# Vim-style Command mode command aliases are also accepted as values:
# "bd"/"bdelete", "q"/"qa"/"quit"/"quitall", "w"/"wa", "wq"/"wqa",
# "bn"/"bnext", "bp"/"bprev" etc. They are dispatched through the full
# Command mode (:) parser, so safety checks (modified-buffer guard, etc.)
# apply. See documents/configfile.md "Command mode command aliases" for the
# full list.
#
# [KeyMapping.All] applies to all modes (except QuickRun).
# Mode-specific sections override All.
#
# [KeyMapping.All]
# "C-s" = "save"
#
# [KeyMapping.Normal]
# "C-s" = "save"
#
# [KeyMapping.Insert]
# "jj" = "Escape"
#
# [KeyMapping.Visual] applies to characterwise Visual mode only.
# [KeyMapping.VisualAll] applies to all visual modes (Visual, VisualBlock, VisualLine).
# [KeyMapping.VisualLine] and [KeyMapping.VisualBlock] for specific visual modes.
# [KeyMapping.Visual]
# "C-c" = "Escape"
#
# [KeyMapping.VisualAll]
# "C-c" = "Escape"
#
# [KeyMapping.VisualLine]
# "C-c" = "Escape"
#
# [KeyMapping.VisualBlock]
# "C-c" = "Escape"
#
# [KeyMapping.Replace]
# "C-c" = "Escape"

# [KeyMapping.Command]
# "C-a" = "Home"
#
# Special mode key mappings (Filer, LogViewer, Help, BufferManager, etc.)
# These work the same way as editing mode mappings.
#
# [KeyMapping.Filer]
# "C-c" = "Escape"
#
# [KeyMapping.LogViewer]
# "C-c" = "Escape"
#
# [KeyMapping.Help]
# "C-c" = "Escape"
#
# [KeyMapping.BufferManager]
# "C-c" = "Escape"
#
# [KeyMapping.BackupManager]
# "C-c" = "Escape"
#
# [KeyMapping.DiffViewer]
# "C-c" = "Escape"
#
# [KeyMapping.Config]
# "C-c" = "Escape"
#
# [KeyMapping.References]
# "C-c" = "Escape"
#
# [KeyMapping.DocumentSymbol]
# "C-c" = "Escape"
#
# [KeyMapping.CallHierarchy]
# "C-c" = "Escape"
#
# [KeyMapping.RecentFile]
# "C-c" = "Escape"
#
# [KeyMapping.Debug]
# "C-c" = "Escape"
#
# [KeyMapping.Terminal]
# "C-c" = "Escape"

# Log settings - controls file-based debug logging behavior
# Debug logging is enabled via -d/--debug command line flag
# Log file: ./moe-debug.log (fallback: /tmp/moe-debug.log)

[Log]
clearOnStart = false                   # Clear existing log file when starting with debug mode

# Debug mode settings - controls what sections are shown in :debug view
# Use :debug command to open the debug viewer (vertical split, auto-refreshes every 500ms)

[Debug.WindowNode]
enable = true                          # Show window info section
currentWindow = true                   # Show current window flag
index = true                           # Show window index
windowIndex = true                     # Show window index in manager
bufferIndex = true                     # Show buffer index
parentIndex = true                     # Show parent index
childLen = true                        # Show child count
splitType = true                       # Show split type
haveCursesWin = true                   # Show curses window flag
y = true                               # Show viewport Y position
x = true                               # Show viewport X position
h = true                               # Show viewport height
w = true                               # Show viewport width
currentLine = true                     # Show current line
currentColumn = true                   # Show current column
expandedColumn = true                  # Show expanded column
cursor = true                          # Show cursor info

[Debug.EditorView]
enable = true                          # Show editor state & display settings
widthOfLineNum = true                  # Show line number width
height = true                          # Show height
width = true                           # Show width
originalLine = false                   # Show original line
start = false                          # Show start position
length = false                         # Show length

[Debug.BufferStatus]
enable = true                          # Show buffer info section
bufferIndex = true                     # Show buffer index
path = true                            # Show file path
openDir = true                         # Show open directory
currentMode = true                     # Show current mode
prevMode = true                        # Show previous mode
language = true                        # Show language
encoding = true                        # Show encoding
countChange = true                     # Show change count
cmdLoop = true                         # Show command loop
lastSaveTime = true                    # Show last save time
bufferLen = true                       # Show buffer length

[Debug.Search]
enable = true                          # Show search state section

[Debug.MacroState]
enable = true                          # Show macro state section

[Debug.Visual]
enable = true                          # Show visual selection section

[Debug.JumpList]
enable = true                          # Show jump list section

[Debug.Lsp]
enable = true                          # Show LSP state section

[Theme]

