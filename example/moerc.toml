gitBranchName = true                   # ✅ Show git branch name (IMPLEMENTED)

showGitInactive = false                # ✅ Show git info in inactive windows (IMPLEMENTED)

showModeInactive = false               # ✅ Show mode in inactive windows (IMPLEMENTED)

# Custom status line format (IMPLEMENTED)
# Supported placeholders:
#   {lineNumber}    - Current line number
#   {totalLines}    - Total lines in buffer
#   {columnNumber}  - Current column number
#   {totalColumns}  - Total columns in current line
#   {encoding}      - File encoding (e.g., "UTF-8")
#   {fileType}      - File type/language (e.g., "Nim", "Toml")
#   {percentage}    - Line percentage (e.g., "50%")
#   {mode}          - Current editor mode
#   {filename}      - Filename only
#   {directory}     - Directory path
#   {filePath}      - Full file path
#   {gitBranch}     - Git branch name
#   {gitChanges}    - Git changes (+N ~N -N)
setupText = "{lineNumber}/{totalLines} {columnNumber}/{totalColumns} {encoding} {fileType}"

[Highlight]

currentLine = true                     # ✅ Highlight current line (IMPLEMENTED) - synced with standard.cursorLine

reservedWord = ["TODO", "WIP", "NOTE"] # ✅ Highlight reserved words (IMPLEMENTED)

replaceText = true                     # ✅ Live substitute preview (IMPLEMENTED) - shows :s/foo/bar/ changes in real-time

pairOfParen = true                     # ✅ Highlight matching parens (IMPLEMENTED) - highlights matching bracket when cursor is on one

fullWidthSpace = true                  # ✅ Highlight full-width spaces (IMPLEMENTED)

trailingSpaces = true                  # ✅ Highlight trailing spaces (IMPLEMENTED)

currentWord = true                     # ✅ Highlight current word (IMPLEMENTED) - highlights all occurrences of word under cursor

[AutoBackup]

enable = false                         # ✅ Auto-backup feature (IMPLEMENTED)

# backupDir = "/home/user/.cache/moe/backups"  # ✅ Backup directory (IMPLEMENTED)

# 10 second idle time before backup
idleTime = 10                          # ✅ Idle time in seconds (IMPLEMENTED)

# 5 minute interval between backups
interval = 5                           # ✅ Interval in minutes (IMPLEMENTED)

dirToExclude = ["/etc"]                # ✅ Directories to exclude (IMPLEMENTED)

[QuickRun]

