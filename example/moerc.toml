kind = "config"                        # Theme kind: "default", "config" - "vscode" not yet supported

# Path to custom theme file (used when kind = "config")
# Sample themes available in example/themes/: dark.toml, light.toml, vivid.toml
path = "~/.config/moe/themes/dark.toml" # Theme file path

[EditorConfig]

enable = true                          # Enable .editorconfig support

[Lsp]

enable = false                         # Enable LSP support

timeout = 30000                        # LSP request timeout in ms

[Lsp.Completion]

enable = true                          # Enable completion

[Lsp.Declaration]

enable = true                          # Enable go to declaration

openWindow = false                     # Open in new window

[Lsp.Definition]

enable = true                          # Enable go to definition

openWindow = false                     # Open in new window

[Lsp.TypeDefinition]

enable = true                          # Enable go to type definition

openWindow = false                     # Open in new window

[Lsp.Implementation]

enable = true                          # Enable go to implementation

openWindow = false                     # Open in new window

[Lsp.Diagnostics]

enable = true                          # Enable diagnostics

autoHover = true                       # Auto show diagnostic hover on cursor

autoHoverDelay = 300                   # Delay in ms before auto hover shows

[Lsp.SignatureHelp]

enable = true                          # Enable signature help

[Lsp.DocumentFormatting]

enable = true                          # Enable document formatting

[Lsp.FoldingRange]

enable = true                          # Enable code folding

[Lsp.SelectionRange]

enable = true                          # Enable selection range

[Lsp.DocumentSymbol]

enable = true                          # Enable document symbols

[Lsp.Hover]

enable = true                          # Enable hover information

[Lsp.InlayHint]

enable = true                          # Enable inlay hints

[Lsp.References]

enable = true                          # Enable find references

[Lsp.CallHierarchy]

enable = true                          # Enable call hierarchy

[Lsp.DocumentHighlight]

enable = true                          # Enable document highlight

[Lsp.DocumentLink]

enable = true                          # Enable document links

[Lsp.CodeLens]

enable = false                         # Enable code lens

[Lsp.Rename]

enable = true                          # Enable rename symbol

[Lsp.SemanticTokens]

enable = true                          # Enable semantic tokens

[Lsp.ExecuteCommand]

