# Language server configurations
# You can add any language by creating a section [Lsp.<language>]
# with extensions, command, and trace settings

[Lsp.nim]

extensions = ["nim"]                   # ✅ File extensions for this language (IMPLEMENTED)

command = "nimlangserver"              # ✅ LSP server command (IMPLEMENTED)

trace = "verbose"                      # ✅ Trace level: "off", "messages", "verbose" (IMPLEMENTED)

[Lsp.rust]

extensions = ["rs"]                    # ✅ File extensions for this language (IMPLEMENTED)

command = "rust-analyzer"              # ✅ LSP server command (IMPLEMENTED)

trace = "verbose"                      # ✅ Trace level (IMPLEMENTED)

rustAnalyzerRunSingle = true           # ✅ rust-analyzer specific: run single (IMPLEMENTED)

rustAnalyzerDebugSingle = true         # ✅ rust-analyzer specific: debug single (IMPLEMENTED)
