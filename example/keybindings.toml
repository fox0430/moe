# Keybindings Configuration for Moe Editor
#
# This file defines custom keybindings for different editor modes.
# Each [[keybinding]] entry defines a single key mapping.
#
# Available modes:
#   - normal   : Normal mode (Vim-like navigation)
#   - insert   : Insert mode (text editing)
#   - visual   : Visual mode (text selection)
#   - replace  : Replace mode
#   - command  : Command mode (ex commands)
#
# Available command types:
#   - action           : General editor actions (save, quit, etc.)
#   - motion           : Cursor movement
#   - mode_switch      : Switch between editor modes
#   - text_object      : Text object operations
#   - operator         : Vim-style operators
#   - operator_pending : Operators requiring additional input
#   - custom           : User-defined commands
#
# Key format:
#   - Single character: "h", "j", "k", "l"
#   - With modifiers:
#     - C-x  : Ctrl+x
#     - M-x  : Meta/Alt+x
#     - S-x  : Shift+x
#   - Special keys: Enter, Tab, Backspace, Delete, Escape, etc.

# Normal Mode Keybindings

# Movement commands
[[keybinding]]
mode = "normal"
key = "h"
command_type = "action"
command = "cursor.left"

[[keybinding]]
mode = "normal"
key = "j"
command_type = "action"
command = "cursor.down"

[[keybinding]]
mode = "normal"
key = "k"
command_type = "action"
command = "cursor.up"

[[keybinding]]
mode = "normal"
key = "l"
command_type = "action"
command = "cursor.right"

# File operations
[[keybinding]]
mode = "normal"
key = "C-s"
command_type = "action"
command = "file.save"

[[keybinding]]
mode = "normal"
key = "C-q"
command_type = "action"
command = "editor.quit"

# Mode switching
[[keybinding]]
mode = "normal"
key = "i"
command_type = "mode_switch"
target_mode = "insert"

[[keybinding]]
mode = "normal"
key = "v"
command_type = "mode_switch"
target_mode = "visual"

[[keybinding]]
mode = "normal"
key = ":"
command_type = "mode_switch"
target_mode = "command"

# Insert Mode Keybindings

[[keybinding]]
mode = "insert"
key = "Escape"
command_type = "mode_switch"
target_mode = "normal"

[[keybinding]]
mode = "insert"
key = "C-c"
command_type = "mode_switch"
target_mode = "normal"

[[keybinding]]
mode = "insert"
key = "C-s"
command_type = "action"
command = "file.save"

# Visual Mode Keybindings

[[keybinding]]
mode = "visual"
key = "Escape"
command_type = "mode_switch"
target_mode = "normal"

[[keybinding]]
mode = "visual"
key = "d"
command_type = "action"
command = "selection.delete"

[[keybinding]]
mode = "visual"
key = "y"
command_type = "action"
command = "selection.yank"

[[keybinding]]
mode = "visual"
key = "h"
command_type = "action"
command = "selection.left"

[[keybinding]]
mode = "visual"
key = "j"
command_type = "action"
command = "selection.down"

[[keybinding]]
mode = "visual"
key = "k"
command_type = "action"
command = "selection.up"

[[keybinding]]
mode = "visual"
key = "l"
command_type = "action"
command = "selection.right"

# Command Mode Keybindings

[[keybinding]]
mode = "command"
key = "Escape"
command_type = "mode_switch"
target_mode = "normal"

[[keybinding]]
mode = "command"
key = "C-c"
command_type = "mode_switch"
target_mode = "normal"

# Custom Keybindings Examples

# Custom command with arguments
# [[keybinding]]
# mode = "normal"
# key = "C-f"
# command_type = "custom"
# command = "search.forward"
# args = ["case_sensitive"]

# Multiple modifier keys
# [[keybinding]]
# mode = "normal"
# key = "C-M-s"
# command_type = "action"
# command = "file.save_as"
