# moe dedicated keymap file
#
# Place this file at:
#   $XDG_CONFIG_HOME/moe/keybindings.toml
#   ~/.config/moe/keybindings.toml
#   ./keybindings.toml          (current directory)
#
# This file uses the SAME entry format as the [KeyMapping] section in
# moerc.toml, but the per-mode tables sit at the top level (the whole file is
# keymaps). Entries here override moerc.toml [KeyMapping] entries for the same
# key in the same mode (the file is loaded last).
#
# Right-hand side forms:
#   "save"                                  - bind the key to a registered command
#   "Escape"                                - replay another key / key sequence
#   "mode_switch normal"                    - switch editor mode
#   "overlay_switch command|search|rename"  - open an overlay (command line / search / rename)
#   { keys = "dd", noremap = false }        - force a key sequence; noremap=false
#                                             expands it recursively through other
#                                             user mappings (Vim :map vs :noremap)
#   { command = "quickrun", args = ["release"] }
#                                           - command with arguments (may contain spaces)
#
# noremap defaults to true (replay the target verbatim, like Vim :noremap).
#
# Mode sections: All, Normal, Insert, Visual, VisualAll, VisualLine, VisualBlock,
#   Replace, Command, Filer, LogViewer, Help, BufferManager,
#   BookmarkManager, BackupManager, DiffViewer, Config, References,
#   DocumentSymbol, CallHierarchy, RecentFile, Debug, Terminal, FileTree.
#   "All" applies to every mode except Command; "VisualAll" applies to Visual,
#   VisualLine and VisualBlock.
#
# Key notation: "h", "C-s" (Ctrl), "M-x" (Alt), "S-Tab" (Shift), "Escape",
#   "g d" (space-separated sequence), "jj" (concatenated sequence).

[All]
C-q = "quit-force"

[Normal]
C-s = "save"
u = "undo"
C-r = "redo"
"g d" = "lsp-goto-definition"
"g r" = "lsp-find-references"
":" = "overlay_switch command"
"/" = "overlay_switch search"

# Force a key sequence and expand it recursively (noremap = false):
x = { keys = "dd", noremap = false }

# Command with arguments:
C-p = { command = "quickrun", args = ["release"] }

[Insert]
jj = "Escape"

[VisualAll]
C-c = "mode_switch normal"

# Special / viewer modes (Filer, BufferManager, Terminal, Help, DiffViewer,
# QuickRun, FileTree, …) use the same format. Example: in the file manager,
# make Ctrl-c behave like Escape.
[Filer]
C-c = "Escape"
